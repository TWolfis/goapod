version: "3.9"

services:
  astrodb:
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nasa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apodnet

volumes:
  postgres-vol:

networks:
  apodnet:
    driver: bridge
